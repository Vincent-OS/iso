LABEL arch64
TEXT HELP
Boot the Vincent OS LiveCD on BIOS.
It allows you to install Vincent OS or perform system maintenance.
ENDTEXT
MENU LABEL Vincent OS LiveCD (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%
