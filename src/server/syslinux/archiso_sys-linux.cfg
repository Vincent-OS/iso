LABEL arch64
TEXT HELP
Boot the Vincent OS Server Installer on BIOS.
It allows you to install Vincent OS Server
ENDTEXT
MENU LABEL Vincent OS Server Installation (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-hardened
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-hardened.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID copytoram=no install-only%
