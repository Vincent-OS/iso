LABEL arch64_nbd
TEXT HELP
Boot the Vincent OS Server using NBD.
It allows you to install Vincent OS Server.
ENDTEXT
MENU LABEL Vincent OS Server (x86_64, NBD)
LINUX ::/%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-hardened
INITRD ::/%INSTALL_DIR%/boot/x86_64/initramfs-linux-hardened.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y install-only
SYSAPPEND 3

LABEL arch64_nfs
